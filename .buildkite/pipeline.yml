# Nodes with values to reuse in the pipeline.
common_params:
  plugins:
  - &docker_plugin
    docker#v3.8.0:
      image: &ruby_version "public.ecr.aws/docker/library/ruby:3.2.2"
      propagate-environment: true
      environment:
        - "RUBYGEMS_API_KEY"
  - &docker_plugin_with_danger_token
    docker#v3.8.0:
      image: *ruby_version
      propagate-environment: true
      environment:
        - "DANGER_GITHUB_API_TOKEN"

steps:
  #################
  # Build and Test
  #################
  - label: "🧪 Build and Test"
    key: test
    command: |
      bundle install

      echo "--- :rubocop: Run Tests"
      bundle exec rspec
    plugins: [*docker_plugin]

  #################
  # Lint (Code)
  #################
  - label: "🧹 Lint (Rubocop)"
    key: rubocop
    command: |
      bundle install

      echo "--- :rubocop: Run Rubocop"
      bundle exec rubocop
    plugins: [*docker_plugin]

  #################
  # Lint (Documentation)
  #################
  - label: "🧹 Lint (Yardstick)"
    key: yardstick
    command: |
      bundle install
      bundle exec rake yardstick_measure
      bundle exec rake verify_measurements
      bundle exec rake yard:check
    plugins: [*docker_plugin]

  #################
  # Lint (Types)
  #################
  - label: "🧹 Lint (Types)"
    key: types
    command: |
      bundle install

      echo "--- :ruby: Install RBS collection"
      # --frozen installs strictly from the committed lock (fails on drift) instead of
      # regenerating it, so the pinned revision is what actually gets type-checked.
      bundle exec rbs collection install --frozen

      echo "--- :ruby: Validate RBS signatures"
      bundle exec rake rbs:validate

      echo "--- :ruby: Type-check with Steep"
      bundle exec rake steep:check
    plugins: [*docker_plugin]

  #################
  # Check Lockfile
  #################
  - label: "🧹 Check Lockfile"
    key: lockfile
    command: |
      bundle install
      bundle check
    plugins: [*docker_plugin]

  #################
  # Danger
  #################
  - label: "⛔️ Danger"
    key: danger
    command: |
      bundle install

      echo "--- :rspec: Generate Code Coverage Data"
      bundle exec rspec

      echo "--- :warning: Run Danger"
      bundle exec danger
    plugins: [*docker_plugin_with_danger_token]

  #################
  # Push to RubyGems
  #################
  - label: ":rubygems: Publish to RubyGems"
    key: "gem-push"
    if: build.tag != null
    depends_on:
     - test
     - rubocop
     - danger
     - lockfile
     - types
    # Note: We intentionally call a separate `.sh` script here (as opposed to having all the
    # commands written inline) to avoid leaking a key used in the process in clear in the
    # BUILDKITE_COMMAND environment variable.
    command: .buildkite/gem-push.sh
    plugins: [*docker_plugin]
